[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_pass"
version = "0.1.0"
description = "Neural post-render pass after Arnold — stylized drawing via conditioned generative models (scaffold)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joey Skeys" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = []
gui = [
  "PySide6>=6.5",
  "numpy>=1.23",
  "imageio>=2.31",
  # OpenEXR is optional on Windows (often needs a binary wheel / conda).
  # "OpenEXR>=1.3.9",
]

[project.scripts]
neural-pass = "neural_pass.pipeline:main_stub"
neural-pass-train = "neural_pass.stages.train_style:main_stub"
neural-pass-mask-editor = "neural_pass.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
